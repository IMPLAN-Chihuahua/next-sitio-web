name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-legacy:
    name: Deploy legacy server
    runs-on:
      - self-hosted
      - linux
      - production
    timeout-minutes: 30

    steps:
      - name: Update, build and restart
        shell: bash
        working-directory: /home/rociomartinez/next-sitio-web
        run: |
          set -Eeuo pipefail

          git switch main
          git fetch origin main
          git merge --ff-only origin/main

          npm ci
          npm run build

          if pm2 describe next-sitio-web >/dev/null 2>&1; then
            pm2 restart next-sitio-web --update-env
          else
            pm2 start npm --name next-sitio-web -- start
          fi

          pm2 save

  deploy-primary:
    name: Deploy primary server (10.218.108.53)
    runs-on:
      - self-hosted
      - linux
      - production-primary
    timeout-minutes: 30

    steps:
      - name: Update, build and restart
        shell: bash
        working-directory: /home/rociomartinez/next-sitio-web
        run: |
          set -Eeuo pipefail

          git switch main
          git fetch origin main
          git merge --ff-only origin/main

          npm ci
          npm run build

          if pm2 describe next-sitio-web >/dev/null 2>&1; then
            pm2 restart next-sitio-web --update-env
          else
            pm2 start npm --name next-sitio-web -- start
          fi

          pm2 save
  notify-teams:
    name: Notify Microsoft Teams
    needs:
      - deploy-legacy
      - deploy-primary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Send deployment result
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          LEGACY_RESULT: ${{ needs.deploy-legacy.result }}
          PRIMARY_RESULT: ${{ needs.deploy-primary.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          if [[ "$LEGACY_RESULT" == "success" &&
                "$PRIMARY_RESULT" == "success" ]]; then
            TITLE="✅ Despliegue completado"
            SUMMARY="El build y despliegue terminaron correctamente."
          else
            TITLE="❌ Error en el despliegue"
            SUMMARY="Uno o más servidores no pudieron completar el proceso."
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          export MESSAGE="$TITLE

          $SUMMARY

          **Repositorio:** $REPOSITORY
          **Rama:** $BRANCH
          **Commit:** $SHORT_SHA
          **Ejecutado por:** $ACTOR
          **Servidor legacy:** $LEGACY_RESULT
          **Servidor principal:** $PRIMARY_RESULT

          [Ver ejecución en GitHub]($RUN_URL)"

          PAYLOAD="$(
            node -e \
              'process.stdout.write(JSON.stringify({type:"message",attachments:[{contentType:"application/vnd.microsoft.card.adaptive",contentUrl:null,content:{$schema:"http://adaptivecards.io/schemas/adaptive-card.json",type:"AdaptiveCard",version:"1.2",body:[{type:"TextBlock",text:process.env.MESSAGE,wrap:true}]}}]}))'
          )"

          curl \
            --fail-with-body \
            --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$TEAMS_WEBHOOK_URL"
